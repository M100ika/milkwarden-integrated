; Milkwarden ESP32 — user configuration file
;
; Upload to ESP32 flash:
;   1. Add to platformio.ini:  board_build.filesystem = littlefs
;   2. Run:                    pio run -t uploadfs
;
; Values here override NVS (flash) settings at every boot.
; Remove a key to keep the NVS-stored value instead.

[scale]
; Calibration factor: raw ADC units per gram.
; Run cal_tare + cal_weight via Telnet to find the correct value.
factor = 420.0

; Number of samples used for the trimmed-mean filter (1..64).
samples = 15

[autozero]
; Automatically tare when the reading stays near zero for hold_ms.
; Useful to compensate for slow thermal drift between milkings.
enabled   = false
threshold = 10.0   ; grams — readings within ±threshold count as "near zero"
hold_ms   = 8000   ; milliseconds the scale must stay near zero before taring

[wifi]
; Note: WiFi credentials are currently compiled from config.h defines.
; To support runtime WiFi config, update initWiFi() in wifi.cpp to read
; these values and call WiFi.begin(ssid, password) with them.
; ssid     = YourNetworkName
; password = YourPassword
